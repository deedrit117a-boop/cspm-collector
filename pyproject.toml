[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspm-collector"
version = "0.1.0"
description = "Read-only AWS/Akamai collector that stores raw API responses in MongoDB"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pymongo>=4.6",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "structlog>=24",
    "requests>=2.31",
    "edgegrid-python>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tzdata",
]

[project.optional-dependencies]
# mongomock 4.3 cannot run bulk_write with pymongo >= 4.11 (driver passes a new 'sort' kwarg)
dev = ["pytest>=8", "pytest-cov>=5", "moto[all]>=5", "mongomock>=4.1", "pymongo>=4.6,<4.11", "httpx>=0.27"]

[project.scripts]
collect = "cspm_collector.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cspm_collector = ["core/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
