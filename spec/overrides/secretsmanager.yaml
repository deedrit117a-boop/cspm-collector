# Secret VALUES are never read (get_secret_value is not in this spec): only metadata and resource policies.
service: secretsmanager
client: secretsmanager
scope: regional
apis:
  - {api: list_secrets, paginate: true, result_path: SecretList, resource_type: secret, id_field: Name, arn_field: ARN}
  - {api: describe_secret, resource_type: secret, depends_on: {api: list_secrets, params: {SecretId: ARN}}}
  - {api: get_resource_policy, resource_type: secret, depends_on: {api: list_secrets, params: {SecretId: ARN}}}
